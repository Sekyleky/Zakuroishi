name: Game report
description: Report a game or app problem in Zakuro Android
body:
  - type: markdown
    attributes:
      value: "Do not attach ROMs, title.so game libraries, firmware, keys or private save data. Remove personal information from logs."
  - type: input
    id: device
    attributes:
      label: Handheld / phone and Android version
      placeholder: AYN Thor, Android version
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: GPU driver
      description: System driver or custom driver name and version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: The game's name, and its title ID if you know it
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region
      placeholder: USA, EUR, JPN...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zakuro Android version
      placeholder: 0.1.5
    validations:
      required: true
  - type: dropdown
    id: recompiled
    attributes:
      label: Recompiled
      description: Whether compiled native game code is enabled in settings
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Playable
        - In-game
        - Intro
        - Boots
        - Nothing
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include reproduction steps, expected behavior, texture-pack use, display layout and whether the second display is enabled. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The app error and relevant adb logcat output, with personal information removed
      render: text
