[package]
name = "zakuro-android"
version = "0.2.30"
edition = "2021"
license = "MIT"

[lib]
name = "zakuro_android"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zakuro-gpu = { path = "../zakuro-gpu", default-features = false }
zakuro-core = { path = "../zakuro-core" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
libloading = "0.8"
jni = "0.21"
log = "0.4"
ndk = { version = "0.9", features = ["audio", "rwh_06"] }
ndk-sys = "0.6"
raw-window-handle = "0.6"
zakuro-common = { path = "../zakuro-common" }
zakuro-core = { path = "../zakuro-core" }
zakuro-gpu = { path = "../zakuro-gpu", features = ["vulkan"] }
